apiVersion: v1
kind: Service
metadata:
  name: movie
  labels:
    app.kubernetes.io/name: movie
    app.kubernetes.io/part-of: ticketshop
spec:
  selector:
    app.kubernetes.io/name: movie
  ports:
    - name: http
      port: 8090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie
  labels:
    app.kubernetes.io/name: movie
    app.kubernetes.io/part-of: ticketshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: movie
  template:
    metadata:
      labels:
        app.kubernetes.io/name: movie
        app.kubernetes.io/part-of: ticketshop
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      initContainers:
        - name: wait-for-mongodb
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until nc -z mongodb 27017; do echo 'waiting for mongodb'; sleep 2; done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: movie
          image: badzboss/ticketshop-movie:v1.0.6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
          volumeMounts:
            - name: movie-env
              mountPath: /etc/env
              readOnly: true
          startupProbe:
            httpGet:
              path: /movie/health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /movie/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /movie/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: movie-env
          secret:
            secretName: movie-env
            items:
              - key: .env
                path: .env
